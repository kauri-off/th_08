[package]
name = "th08"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
web-time = "1.1.0"
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color", "string"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
ab_glyph = "0.2"
env_logger = "0.11.11"
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
egui-winit = { version = "0.37", default-features = false }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "Element", "File", "FileList", "Location", "UrlSearchParams", "Blob", "Event", "console", "CanvasRenderingContext2d", "ImageData", "TextMetrics", "Storage"] }

[profile.dev.package."*"]
opt-level = 2
